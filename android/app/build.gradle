plugins {
    id 'com.android.application'
}

def releaseKeystore = System.getenv('FAMILY_POLICY_KEYSTORE')
def releaseStorePassword = System.getenv('FAMILY_POLICY_STORE_PASSWORD')
def releaseKeyAlias = System.getenv('FAMILY_POLICY_KEY_ALIAS')
def releaseKeyPassword = System.getenv('FAMILY_POLICY_KEY_PASSWORD')
def hasReleaseSigning = [releaseKeystore, releaseStorePassword, releaseKeyAlias, releaseKeyPassword].every { it }

android {
    namespace 'org.familypolicy.android'
    compileSdk 36

    defaultConfig {
        applicationId 'org.familypolicy.android'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '0.1.0-preview.1'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseKeystore)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            versionNameSuffix '-debug'
        }
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20260814'
    androidTestImplementation 'androidx.test:core:1.7.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
}
